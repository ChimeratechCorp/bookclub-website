<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #101820;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 600px;
        }

        .icon {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            margin-bottom: 16px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
            line-height: 1.7;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon" aria-hidden="true">🚧</div>

        <h1>Under Construction</h1>

        <p>We're working on something new.</p>

        <p>Our website will be back soon. Thanks for your patience!</p>
    </main>
</body>
</html>
