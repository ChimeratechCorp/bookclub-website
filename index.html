<!DOCTYPE html>
<html>
  <head>
    <title>Project Bookclub</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 95vh;
        margin: 20px;
        user-select: none;
        background-color: #17140F;
        overflow-x: hidden;
      }

      /* ===== HERO BANNER ===== */
      .hero {
        width: 100vw;
        margin-left: calc(50% - 50vw);
        margin-bottom: 10px;
      }

      .hero img {
        width: 100%;
        height: auto;
        display: block;
      }

      .main-row {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
        align-items: center;
        width: 100%;
        gap: 20px;
      }

      .controls-container {
        flex: 1;
        max-width: 400px;
        padding: 20px;
        background: #EEE4C8;
        border: 2px solid #000000;
        border-radius: 8px;
      }

      /* ===== BANNER STYLES ===== */
      .banner {
        background-color: #000000;
        color: #ffffff;
        text-align: center;
        padding: 14px 10px;
        margin: -20px -20px 15px -20px;
        border-radius: 8px 8px 0 0;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.5px;
        border-bottom: 3px solid #000000;
      }

      .banner a {
        color: #ffffff;
        text-decoration: underline;
        font-weight: bold;
      }

      .banner a:hover {
        color: #cccccc;
      }

      .banner-sub {
        font-size: 12px;
        font-weight: normal;
        opacity: 0.8;
        display: block;
        margin-top: 2px;
      }

      .wheel-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .wheel-wrapper {
        position: relative;
        width: 500px;
        height: 500px;
        margin-top: 20px;
      }

      .ticker {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 30px solid #A9782F;
        z-index: 10;
      }

      textarea {
        width: 100%;
        margin: 10px 0 20px 0;
        padding: 12px;
        font-size: 16px;
        box-sizing: border-box;
        border: 2px solid #000000;
        border-radius: 4px;
        resize: vertical;
        background-color: #ffffff;
        color: #000000;
      }

      #spinBtn {
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #000000;
        background-color: #000000;
        color: #ffffff;
        border-radius: 5px;
        transition: transform 0.1s, background-color 0.2s;
        width: 100%;
        margin-bottom: 10px;
      }

      #spinBtn:hover {
        background-color: #333333;
      }

      #spinBtn:active {
        transform: scale(0.98);
      }

      #spinBtn:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .sync-buttons {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
      }

      .sync-btn {
        padding: 10px 15px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        border: 2px solid #000000;
        border-radius: 5px;
        transition: all 0.2s;
        width: 100%;
        text-align: center;
        background-color: #ffffff;
        color: #000000;
      }

      .sync-btn:hover {
        background-color: #f0f0f0;
        transform: scale(0.98);
      }

      .sync-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #syncStatus {
        font-size: 12px;
        color: #555555;
        margin-top: 5px;
        text-align: center;
        min-height: 20px;
      }

      #wheelCanvas {
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background-color: #EEE4C8;
      }

      .image-container {
        flex: 1;
        max-width: 350px;
        padding: 20px;
        background: #EEE4C8;
        border: 2px solid #000000;
        border-radius: 8px;
        text-align: center;
      }

      #bookImage {
        max-width: 300px;
        border: 2px solid #000000;
        border-radius: 4px;
        display: none;
      }

      #imagePlaceholder {
        font-size: 14px;
        color: #555555;
      }

      .stats-container {
        margin-top: 15px;
        padding: 10px;
        background: #f5f5f5;
        border: 1px solid #000000;
        border-radius: 4px;
        font-size: 12px;
        color: #000000;
      }

      #spinCount {
        font-weight: bold;
      }

      .current-picks {
        font-size: 11px;
        color: #555555;
        margin-top: 4px;
      }

      h1 {
        color: #E8DFC4;
      }

      h2 {
        color: #000000;
      }

      label {
        color: #000000;
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>

  <body>

    <!-- ===== HERO ===== -->
    <div class="hero">
      <img src="who-spunnit-banner.jpg" alt="Who Spunnit? Spin the wheel. Find your next great read.">
    </div>

    <div class="main-row">

    <div class="controls-container">
      <!-- ===== BANNER ===== -->
      <div class="banner">
        PROJECT BOOKCLUB
        <span class="banner-sub">
          <a href="https://docs.google.com/spreadsheets/d/1ie6_uo8E5rhwOxDqyKT6phaFex-8er-Kpfao2tUXNcA/edit?gid=737109426#gid=737109426" target="_blank">Open Google Sheet</a>
        </span>
      </div>

      <p style="margin: -5px 0 10px 0; font-size: 14px; color: #555555; text-align: center;">By: Robert Cruz</p>
      
      <label for="bookList"><strong>Book List:</strong></label>
      <textarea id="bookList" rows="10" placeholder="List your books here..."
        oninput="onBookListChange(); saveBooks(); drawWheel()"></textarea>

      <button id="spinBtn">Spin the Wheel</button>
      
      <!-- Google Sheets sync buttons -->
      <div class="sync-buttons">
        <button id="syncFullBtn" class="sync-btn">Sync Full TBR</button>
        <button id="syncWheelBtn" class="sync-btn">Sync Wheel Picks</button>
      </div>
      <div id="syncStatus">Click to load books from your spreadsheet</div>
      
      <!-- Spin statistics -->
      <div class="stats-container">
        <strong>Stats:</strong><br>
        Total spins: <span id="spinCount">0</span> | 
        Last spun: <span id="lastSpin">Never</span>
        <div class="current-picks">
          Current List Loaded: <span id="currentSource">Not synced</span>
        </div>
      </div>
    </div>

    <div class="wheel-container">
      <h1 id="result">Spin the Wheel!</h1>
      <div class="wheel-wrapper">
        <div class="ticker"></div>
        <canvas id="wheelCanvas" width="500" height="500"></canvas>
      </div>
    </div>

    <div class="image-container">
      <h2>Selected Book Cover</h2>
      <div id="bookImageBox">
        <p id="imagePlaceholder">Spin the wheel to see the book cover here.</p>
        <img id="bookImage" src="" alt="">
      </div>
    </div>

    </div><!-- /.main-row -->

    <script>
      // ===== CONFIGURATION =====
      const GOOGLE_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxwiNSENzLmnUdzijZrzKHFQvyYKiG1r7V8s1A2zLiuk6wdrzSAqlSiSE0WAWJI9V2-cA/exec';

      // Cover lookup tuning
      const MAX_SEARCH_RESULTS = 25;      // works pulled from search.json
      const MAX_EDITIONS_TO_FETCH = 40;   // editions pulled per work
      const MIN_TITLE_SCORE = 0.80;       // how closely a result must match
      const COVER_ASPECT_MIN = 1.15;      // height / width — rejects scans
      const COVER_ASPECT_MAX = 2.0;
      
      // ===== STATE =====
      let currentRotation = 0;
      let isSpinning = false;
      let isHolding = false;
      let holdStartTime = 0;
      let spinLoopInterval = null;
      let totalSpins = parseInt(localStorage.getItem('totalSpins') || '0');
      let lastSpinBook = localStorage.getItem('lastSpinBook') || 'Never';
      let currentSource = localStorage.getItem('currentSource') || 'Not synced';

      const canvas = document.getElementById("wheelCanvas");
      const spinButton = document.getElementById("spinBtn");
      const syncFullBtn = document.getElementById("syncFullBtn");
      const syncWheelBtn = document.getElementById("syncWheelBtn");
      const syncStatus = document.getElementById("syncStatus");
      const spinCountEl = document.getElementById("spinCount");
      const lastSpinEl = document.getElementById("lastSpin");
      const currentSourceEl = document.getElementById("currentSource");
      const bookListTextarea = document.getElementById("bookList");
      const resultEl = document.getElementById("result");

      // Update stats display
      function updateStats() {
        spinCountEl.textContent = totalSpins;
        lastSpinEl.textContent = lastSpinBook;
        currentSourceEl.textContent = currentSource;
      }
      updateStats();

      // ===== BOOK LIST CHANGE DETECTION =====
      function onBookListChange() {
        // Check if the current text matches what was synced
        const currentText = bookListTextarea.value;
        const savedSyncedText = localStorage.getItem('syncedBookListData');
        
        // If the text is different from what was synced, mark as custom
        if (savedSyncedText && currentText !== savedSyncedText) {
          currentSource = 'Custom';
          localStorage.setItem('currentSource', currentSource);
          currentSourceEl.textContent = currentSource;
        } else if (!savedSyncedText && currentText.trim() !== '') {
          // If there's no synced text but there is content, it's custom
          currentSource = 'Custom';
          localStorage.setItem('currentSource', currentSource);
          currentSourceEl.textContent = currentSource;
        }
      }

      // ===== LOCAL STORAGE =====
      function saveBooks() {
        localStorage.setItem("bookListData", bookListTextarea.value);
      }

      function loadBooks() {
        const saved = localStorage.getItem("bookListData");
        if (saved && saved.trim() !== "") {
          bookListTextarea.value = saved;
        } else {
          bookListTextarea.value =
`The Great Gatsby
To Kill a Mockingbird
1984
Pride and Prejudice
The Catcher in the Rye`;
        }
        
        // Anything that doesn't match the last synced list is a custom list
        const syncedText = localStorage.getItem('syncedBookListData');
        const matchesSync = syncedText && bookListTextarea.value === syncedText;

        if (!matchesSync && bookListTextarea.value.trim() !== '') {
          currentSource = 'Custom';
          localStorage.setItem('currentSource', currentSource);
          currentSourceEl.textContent = currentSource;
        }
      }

      function checkForBooks() {
        return bookListTextarea.value
          .split("\n")
          .map(b => b.replace(/^["'\s]+|["'\s]+$/g, '').trim())
          .filter(b => b !== "");
      }

      // ===== DRAW WHEEL =====
      function drawWheel() {
        const books = checkForBooks();
        const ctx = canvas.getContext("2d");
        const totalSlices = books.length;

        ctx.clearRect(0, 0, 500, 500);
        if (totalSlices === 0) {
          ctx.font = 'bold 20px Arial';
          ctx.fillStyle = '#999999';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Add books or sync', 250, 250);
          return;
        }

        const angleOfSlice = (Math.PI * 2) / totalSlices;
        const radius = 230;

        ctx.beginPath();
        ctx.arc(250, 250, radius, 0, Math.PI * 2);
        ctx.lineWidth = 3;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        for (let i = 0; i < totalSlices; i++) {
          const startAngle = i * angleOfSlice;

          ctx.beginPath();
          ctx.moveTo(250, 250);
          ctx.lineTo(250 + Math.cos(startAngle) * radius, 250 + Math.sin(startAngle) * radius);
          ctx.lineWidth = 2;
          ctx.strokeStyle = "#000000";
          ctx.stroke();

          ctx.save();
          ctx.translate(250, 250);
          ctx.rotate(startAngle + angleOfSlice / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#000000";

          let fontSize = 18;
          if (totalSlices > 15) fontSize = 14;
          if (totalSlices > 30) fontSize = 12;
          ctx.font = `bold ${fontSize}px Arial`;

          let title = books[i];
          if (title.length > 25) {
            title = title.substring(0, 22) + "...";
          }

          ctx.fillText(title, radius - 20, 0);
          ctx.restore();
        }
      }

      // ===== SPIN LOGIC =====
      spinButton.addEventListener("mousedown", startSpinAction);
      window.addEventListener("mouseup", stopSpinAction);

      spinButton.addEventListener("touchstart", (e) => {
        e.preventDefault();
        startSpinAction();
      });
      window.addEventListener("touchend", stopSpinAction);

      function startSpinAction() {
        const bookArray = checkForBooks();
        if (bookArray.length === 0) {
          resultEl.innerText = "The list box is empty!";
          return;
        }
        if (isSpinning) return;

        isHolding = true;
        holdStartTime = Date.now();
        resultEl.innerText = "Charging up spin...";

        canvas.style.transition = "none";

        spinLoopInterval = setInterval(() => {
          currentRotation += 18;
          canvas.style.transform = "rotate(" + (currentRotation % 360) + "deg)";
        }, 16.67);
      }

      function stopSpinAction() {
        if (!isHolding) return;
        isHolding = false;
        isSpinning = true;
        spinButton.disabled = true;
        syncFullBtn.disabled = true;
        syncWheelBtn.disabled = true;

        clearInterval(spinLoopInterval);

        const bookArray = checkForBooks();
        const totalSlices = bookArray.length;
        resultEl.innerText = "Spinning...";

        canvas.style.transition = "transform 4s cubic-bezier(0.1, 0.8, 0.25, 1)";

        const winnerIndex = Math.floor(Math.random() * totalSlices);
        const sliceDegrees = 360 / totalSlices;

        const currentSliceCenterDegree = (winnerIndex * sliceDegrees) + (sliceDegrees / 2);
        const targetDegreeStop = (270 - currentSliceCenterDegree + 360) % 360;

        const durationHeld = Date.now() - holdStartTime;
        const fullSpins = durationHeld > 400 ? 1440 : 2160;

        const baseNormalizedRotation = currentRotation - (currentRotation % 360);
        currentRotation = baseNormalizedRotation + fullSpins + targetDegreeStop;

        canvas.style.transform = "rotate(" + currentRotation + "deg)";

        setTimeout(() => {
          const selectedBook = bookArray[winnerIndex];
          resultEl.innerText = selectedBook;

          // Update stats
          totalSpins++;
          lastSpinBook = selectedBook;
          localStorage.setItem('totalSpins', totalSpins.toString());
          localStorage.setItem('lastSpinBook', lastSpinBook);
          updateStats();

          // Load book cover
          loadBookImage(selectedBook);

          confetti({
            particleCount: 150,
            spread: 80,
            origin: { y: 0.6 }
          });

          isSpinning = false;
          spinButton.disabled = false;
          syncFullBtn.disabled = false;
          syncWheelBtn.disabled = false;
        }, 4000);
      }

      // ===== GOOGLE SHEETS INTEGRATION =====

      async function syncFromGoogleSheets(type, sourceName) {
        if (!GOOGLE_SHEETS_URL) {
          syncStatus.textContent = 'Please set your Google Sheets URL first!';
          return;
        }

        syncFullBtn.disabled = true;
        syncWheelBtn.disabled = true;
        syncStatus.textContent = `Loading ${sourceName}...`;

        try {
          const url = `${GOOGLE_SHEETS_URL}?action=getBooks&type=${type}`;
          console.log('Fetching:', url);
          
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          
          const data = await response.json();
          console.log('Data received:', data);
          
          if (data.success && data.books && data.books.length > 0) {
            const bookList = data.books.join('\n');
            bookListTextarea.value = bookList;
            saveBooks();
            
            // Store the synced text so we can detect custom changes later
            localStorage.setItem('syncedBookListData', bookList);
            
            drawWheel();
            
            currentSource = sourceName;
            localStorage.setItem('currentSource', currentSource);
            updateStats();

            syncStatus.textContent = `Synced ${data.books.length} books from ${sourceName}!`;
          } else {
            syncStatus.textContent = `${data.error || 'No books found!'}`;
          }
        } catch (error) {
          console.error('Sync error:', error);
          syncStatus.textContent = `Failed to sync: ${error.message}`;
        } finally {
          syncFullBtn.disabled = false;
          syncWheelBtn.disabled = false;
        }
      }

      // Sync button events
      syncFullBtn.addEventListener('click', () => syncFromGoogleSheets('full', 'Full TBR'));
      syncWheelBtn.addEventListener('click', () => syncFromGoogleSheets('wheel', 'Wheel Picks'));

      // ===== COVER HELPERS =====

      // Load an image URL and report back its real pixel dimensions.
      function testCoverImage(url) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve({ url, width: img.naturalWidth, height: img.naturalHeight });
          img.onerror = () => reject(new Error('Image failed to load'));
          img.src = url;
        });
      }

      // Real cover art sits in a fairly narrow height:width band. Raw
      // scans (extra border, sideways photo, cropped wide) usually fall
      // outside it, so this rejects most reader-uploaded photos.
      function hasPlausibleCoverAspect(width, height) {
        if (!width || !height) return false;
        const ratio = height / width;
        return ratio >= COVER_ASPECT_MIN && ratio <= COVER_ASPECT_MAX;
      }

      // Strip punctuation/accents so "The Serpent & the Wings of Night"
      // and "The Serpent and the Wings of Night" compare as equal.
      function normalizeTitle(title) {
        return title
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/&/g, ' and ')
          .replace(/['\u2019]/g, '')
          .replace(/[^a-z0-9\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
      }

      // Weighted word overlap between what we asked for and what came back.
      function getTitleMatchScore(requestedTitle, resultTitle) {
        if (requestedTitle === resultTitle) return 1.0;

        const requestedWords = new Set(requestedTitle.split(' '));
        const resultWords = new Set(resultTitle.split(' '));
        let matchingWords = 0;

        for (const word of requestedWords) {
          if (resultWords.has(word)) matchingWords++;
        }

        const requestedCoverage = requestedWords.size ? matchingWords / requestedWords.size : 0;
        const resultCoverage = resultWords.size ? matchingWords / resultWords.size : 0;

        return (requestedCoverage * 0.7) + (resultCoverage * 0.3);
      }

      // ===== COVER SEARCH (OPEN LIBRARY) =====
      //
      // Strategy, in order of trust:
      //   1. The work's own librarian-curated `covers` field. This is the
      //      same cover Open Library shows on the book's page, so it's
      //      the official English art rather than a guess.
      //   2. Individual editions, filtered to ones marked English, as a
      //      fallback for works with no curated cover set.
      //   3. The search result's own cover_i, as a last resort.
      //
      // Why the language check matters: search.json returns WORKS, and a
      // work's aggregate `language` field lists every translation that
      // exists. So a work can show "eng" while its cover_i/edition_key
      // points at, say, the Dutch edition. Editions must be checked one
      // at a time for their own language.
      //
      // Google Books is deliberately not used here — its unauthenticated
      // quota is shared and returns HTTP 429 in practice.

      async function searchOpenLibraryCover(title) {
        const cleanTitle = normalizeTitle(title);

        const searchUrl =
          'https://openlibrary.org/search.json?title=' + encodeURIComponent(title) +
          '&limit=' + MAX_SEARCH_RESULTS +
          '&fields=key,title,author_name,language,isbn,cover_i,edition_key';

        const response = await fetch(searchUrl);
        if (!response.ok) throw new Error(`Open Library returned HTTP ${response.status}`);

        const data = await response.json();
        if (!data.docs || data.docs.length === 0) throw new Error('No Open Library results');

        // --- Rank works by how well the title matches ---
        const scoredDocs = data.docs
          .map(doc => ({
            doc,
            titleScore: getTitleMatchScore(cleanTitle, normalizeTitle(doc.title || ''))
          }))
          .filter(entry => entry.titleScore >= MIN_TITLE_SCORE)
          .sort((a, b) => b.titleScore - a.titleScore);

        if (scoredDocs.length === 0) throw new Error('No matching titles found');

        // --- 1. Work-level curated cover (best source) ---
        for (const { doc, titleScore } of scoredDocs) {
          if (!doc.key) continue; // doc.key looks like "/works/OL12345W"

          try {
            const workResp = await fetch(`https://openlibrary.org${doc.key}.json`);
            if (!workResp.ok) continue;

            const workData = await workResp.json();
            const workCovers = (workData.covers || []).filter(id => id && id > 0);

            for (const coverId of workCovers) {
              const imageUrl = `https://covers.openlibrary.org/b/id/${coverId}-L.jpg`;
              try {
                const image = await testCoverImage(imageUrl);
                if (image.width >= 300 && image.height >= 450 &&
                    hasPlausibleCoverAspect(image.width, image.height)) {
                  console.log('Cover source: work-curated', imageUrl);
                  return { url: imageUrl, width: image.width, height: image.height, titleScore, source: 'work_curated' };
                }
              } catch (e) { /* try next cover id */ }
            }
          } catch (e) {
            console.log('Work lookup failed for', doc.key, e);
          }
        }

        // --- 2. English editions only ---
        const candidates = [];

        for (const { doc, titleScore } of scoredDocs) {
          if (!doc.key) continue;

          try {
            const editionsResp = await fetch(
              `https://openlibrary.org${doc.key}/editions.json?limit=${MAX_EDITIONS_TO_FETCH}`
            );
            if (!editionsResp.ok) continue;

            const editionsData = await editionsResp.json();

            for (const edition of (editionsData.entries || [])) {
              const languages = (edition.languages || []).map(l => l.key);
              if (!languages.includes('/languages/eng')) continue;

              // Covers attached straight to the edition are most trustworthy
              for (const coverId of (edition.covers || [])) {
                if (coverId && coverId > 0) {
                  candidates.push({
                    imageUrl: `https://covers.openlibrary.org/b/id/${coverId}-L.jpg`,
                    titleScore,
                    rank: 3
                  });
                }
              }

              for (const isbn of [...(edition.isbn_13 || []), ...(edition.isbn_10 || [])]) {
                candidates.push({
                  imageUrl: `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`,
                  titleScore,
                  rank: 2
                });
              }

              if (edition.key) {
                candidates.push({
                  imageUrl: `https://covers.openlibrary.org/b/olid/${edition.key.split('/').pop()}-L.jpg`,
                  titleScore,
                  rank: 1
                });
              }
            }
          } catch (e) {
            console.log('Editions lookup failed for', doc.key, e);
          }

          if (candidates.length >= 8) break; // don't hammer the API
        }

        const validCovers = [];

        for (const candidate of candidates) {
          try {
            const image = await testCoverImage(candidate.imageUrl);
            if (image.width >= 200 && image.height >= 300 &&
                hasPlausibleCoverAspect(image.width, image.height)) {
              validCovers.push({
                url: candidate.imageUrl,
                width: image.width,
                height: image.height,
                titleScore: candidate.titleScore,
                rank: candidate.rank,
                source: 'english_edition'
              });
            }
          } catch (e) { /* skip broken image */ }
        }

        // --- 3. Last resort: the search result's own cover_i ---
        if (validCovers.length === 0) {
          for (const { doc, titleScore } of scoredDocs) {
            if (!doc.cover_i) continue;

            const imageUrl = `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
            try {
              const image = await testCoverImage(imageUrl);
              if (image.width >= 100 && image.height >= 150 &&
                  hasPlausibleCoverAspect(image.width, image.height)) {
                validCovers.push({
                  url: imageUrl,
                  width: image.width,
                  height: image.height,
                  titleScore,
                  rank: 0,
                  source: 'search_fallback'
                });
                break;
              }
            } catch (e) { /* skip */ }
          }
        }

        if (validCovers.length === 0) throw new Error('No usable covers found');

        // Best title match, then most trustworthy source, then biggest image
        validCovers.sort((a, b) => {
          if (b.titleScore !== a.titleScore) return b.titleScore - a.titleScore;
          if (b.rank !== a.rank) return b.rank - a.rank;
          return (b.width * b.height) - (a.width * a.height);
        });

        console.log('Cover source:', validCovers[0].source, validCovers[0].url);
        return validCovers[0];
      }

      // ===== BOOK COVER LOADER =====
      async function loadBookImage(title) {
        const imageElement = document.getElementById("bookImage");
        const placeholder = document.getElementById("imagePlaceholder");

        imageElement.style.display = "none";
        imageElement.src = "";
        imageElement.alt = "";
        placeholder.textContent = "Loading cover...";

        try {
          const bestCover = await searchOpenLibraryCover(title);

          imageElement.src = bestCover.url;
          imageElement.alt = title;
          imageElement.style.display = "block";
          placeholder.textContent = "";
        } catch (error) {
          console.error('Unable to find cover:', title, error);
          placeholder.textContent = "No cover found for this title.";
        }
      }

      // ===== INIT =====
      loadBooks();
      drawWheel();
    </script>
  </body>
</html>
